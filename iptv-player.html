<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=iptv.html">
    <title>Redirection...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #cbd5e1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(6, 182, 212, 0.3);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        a {
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Redirection JavaScript comme backup
        setTimeout(function () {
            window.location.href = 'iptv.html';
        }, 100);
    </script>
</head>

<body>
    <div class="container">
        <h1>🔄 Redirection en cours...</h1>
        <p>
            Vous êtes redirigé vers la nouvelle version du player IPTV.
        </p>
        <div class="spinner"></div>
        <p style="margin-top: 30px; font-size: 0.9rem;">
            Si la redirection ne fonctionne pas automatiquement,<br>
            <a href="iptv.html">cliquez ici</a>.
        </p>
    </div>
</body>

</html>
